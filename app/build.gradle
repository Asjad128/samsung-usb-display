android {
    namespace 'your.package.name'
    compileSdk 33

    defaultConfig {
        applicationId "com.afas.samsungusbdisplay   "
        minSdk 16
        targetSdk 29
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        ndk { abiFilters "armeabi-v7a" }   // remove if there are no native libs
    }

    buildTypes {
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'   // 1.6+ needs minSdk 19
    // pin everything else to versions that support minSdk 16
}